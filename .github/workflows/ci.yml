name: ci

# Pull requests and main run the same checks as `make verify`, with no cloud
# access at all: no id-token permission, no secrets, no role to assume.
# Shared checks come from reusable workflows in gamaware/.github. The verify
# job runs `make verify`, so local runs and CI cannot drift apart.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    name: lint-docs
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-docs.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)

  lint-actions:
    name: lint-actions
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/lint-actions.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)

  secrets:
    name: secrets
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/secrets.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)

  security:
    name: security
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/security.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    with:
      checkov-config: .checkov.yaml
      trivy-skip-dirs: .venv

  terraform:
    name: terraform
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/terraform.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    with:
      working-directories: '["infra/terraform/registry", "infra/terraform/agent"]'
      terraform-version: 1.14.5
      tflint-version: v0.61.0

  container:
    name: container
    permissions:
      contents: read
    uses: gamaware/.github/.github/workflows/container.yml@01271d87e89c5f893e1e3a92eb6ba4d484286514 # main (01271d8)
    with:
      context: .
      dockerfile: agent/Dockerfile
      image-name: harbor-store-ops-agent

  verify:
    name: make verify
    # ARM64 runner: AgentCore Runtime runs arm64 images, so the smoke test
    # exercises the image that ships.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.61.0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Install hadolint
        run: |
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-arm64"
          echo "${HADOLINT_SHA256}  ${RUNNER_TEMP}/hadolint" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/hadolint"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      - name: Python checks, image, smoke test, Terraform, hadolint, Checkov, Trivy and Semgrep
        run: make verify

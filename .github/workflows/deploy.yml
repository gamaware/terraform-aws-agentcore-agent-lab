name: deploy

# Build once, scan, push by digest, deploy that digest to AgentCore Runtime.
#
#   build   ARM64 image built one time, unit tests and smoke test run, Trivy
#           scan, SBOM, saved as an artifact. No AWS access.
#   push    loads that exact image (image ID checked), pushes it to ECR and
#           records the digest ECR returns, plus a build provenance attestation.
#   deploy  terraform apply of the agent stack with container_uri=<repo>@sha256:<digest>;
#           AgentCore creates a new runtime version and the "live" endpoint
#           moves to it. scripts/deploy.sh waits until the endpoint is READY.
#
# AWS access is keyless (GitHub OIDC), with two roles: a push role that can
# only push to the ECR repository, and a deploy role for terraform apply.
# Creating them is outside this repo; see github-actions-aws-oidc-lab. Until
# the repository variables below are set, only the build job runs.
#   AWS_PUSH_ROLE_ARN, AWS_DEPLOY_ROLE_ARN, AWS_REGION, ECR_REPOSITORY_URL,
#   ECR_REPOSITORY_ARN, TF_STATE_BUCKET, KNOWLEDGE_BASE_ID (optional)
# Restrict the "registry" and "production" environments to the main branch
# and require a reviewer on "production".
on:
  push:
    branches: [main]
    paths:
      - src/**
      - agent/**
      - pyproject.toml
      - uv.lock
      - tools/**
      - policy/**
      - infra/terraform/agent/**
      - scripts/deploy.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions: {}

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and scan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Unit tests
        run: make py-test

      - name: Build image
        id: build
        run: |
          docker build --platform linux/arm64 --file agent/Dockerfile --tag harbor-store-ops-agent:ci .
          echo "image-id=$(docker image inspect --format '{{.Id}}' harbor-store-ops-agent:ci)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: scripts/smoke-test.sh harbor-store-ops-agent:ci

      # Gate on what can be fixed: HIGH and CRITICAL with a released fix.
      - name: Trivy image scan
        run: trivy image --quiet --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed harbor-store-ops-agent:ci

      - name: SBOM (CycloneDX)
        run: trivy image --quiet --format cyclonedx --output sbom.cdx.json harbor-store-ops-agent:ci

      - name: Save image
        run: docker save harbor-store-ops-agent:ci | gzip > image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: |
            image.tar.gz
            sbom.cdx.json
          retention-days: 7
          if-no-files-found: error

  push:
    name: Push by digest
    needs: build
    # workflow_dispatch can target any branch; only main may push and deploy.
    if: github.ref == 'refs/heads/main' && vars.AWS_PUSH_ROLE_ARN != '' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: registry
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      - name: Load the scanned image
        env:
          EXPECTED_ID: ${{ needs.build.outputs.image-id }}
        run: |
          gunzip --stdout image.tar.gz | docker load
          actual="$(docker image inspect --format '{{.Id}}' harbor-store-ops-agent:ci)"
          if [ "$actual" != "$EXPECTED_ID" ]; then
            echo "::error::loaded image $actual is not the scanned image $EXPECTED_ID"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push
        id: push
        env:
          REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          SHA: ${{ github.sha }}
        run: |
          docker tag harbor-store-ops-agent:ci "${REPOSITORY_URL}:${SHA}"
          docker push "${REPOSITORY_URL}:${SHA}"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "${REPOSITORY_URL}:${SHA}")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${image#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${image}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ vars.ECR_REPOSITORY_URL }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to AgentCore Runtime
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write backend and variable files
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_ARN: ${{ vars.ECR_REPOSITORY_ARN }}
          KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID }}
        run: |
          {
            echo "bucket       = \"${STATE_BUCKET}\""
            echo "key          = \"harbor-store-ops-agent/agent.tfstate\""
            echo "region       = \"${REGION}\""
            echo "encrypt      = true"
            echo "use_lockfile = true"
          } > "${RUNNER_TEMP}/backend.hcl"
          {
            echo "region             = \"${REGION}\""
            echo "ecr_repository_arn = \"${ECR_REPOSITORY_ARN}\""
            echo "knowledge_base_id  = \"${KNOWLEDGE_BASE_ID}\""
          } > "${RUNNER_TEMP}/production.tfvars"
          cp infra/terraform/agent/backend.tf.example infra/terraform/agent/backend.tf

      - name: Deploy and wait for the endpoint
        env:
          IMAGE: ${{ needs.push.outputs.image }}
        run: |
          TF_BACKEND_CONFIG="${RUNNER_TEMP}/backend.hcl" \
          TF_VAR_FILE="${RUNNER_TEMP}/production.tfvars" \
            scripts/deploy.sh "$IMAGE"

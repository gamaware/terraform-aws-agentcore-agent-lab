version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base image digests in agent/Dockerfile (build and runtime stages).
  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/registry
      - /infra/terraform/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
